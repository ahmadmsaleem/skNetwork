name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build, for example v0.1.0'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build and publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0

            - name: Validate the Gradle wrapper
              uses: gradle/actions/wrapper-validation@v6

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: temurin
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Check the tag matches the project version
              run: |
                  TAG="${{ inputs.tag || github.ref_name }}"
                  PROJECT=$(grep -E '^version *= *' gradle.properties | sed 's/.*= *//')
                  echo "tag $TAG, gradle.properties $PROJECT"
                  if [ "$TAG" != "v$PROJECT" ]; then
                      echo "::error::Tag $TAG does not match version $PROJECT in gradle.properties."
                      exit 1
                  fi
                  if echo "$PROJECT" | grep -q SNAPSHOT; then
                      echo "::error::$PROJECT is a snapshot, so it cannot be released."
                      exit 1
                  fi

            - name: Run the tests
              run: ./gradlew :test:test --no-daemon --console=plain

            - name: Build the universal jar
              run: ./gradlew universalJar --no-daemon --console=plain

            # The jar is attached to the release below as well. This copy is what a
            # workflow_dispatch run leaves behind, for a maintainer to pick up without
            # cutting a release.
            - name: Keep the jar for a maintainer to collect
              uses: actions/upload-artifact@v6
              with:
                  name: skNetwork-jar
                  path: build/libs/skNetwork-*.jar
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish the release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  name: skNetwork ${{ inputs.tag || github.ref_name }}
                  generate_release_notes: true
                  draft: true
                  prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
                  files: build/libs/skNetwork-*.jar
                  fail_on_unmatched_files: true
                  body: |
                      <!-- One or two lines: what this release is for. -->

                      ## What's new

                      -

                      <!-- Protocol change? Say so here: it means every half has to be
                           updated together, not just the backends. -->

                      ## Install

                      The jar is attached below. It goes in `plugins/` on the proxy
                      **and** on every game server: one jar, it works out which half to
                      be. Restart the network, then check `/sknetproxy` on the proxy and
                      `/sknet` on a backend both say `READY`.

                      Every server has to run the same build. A half that is behind is
                      refused when it connects, with a message on both consoles saying
                      which side to update.

                      Read more about the setup [here](https://github.com/ahmadmsaleem/skNetwork/wiki/Setup)

                      ## Requirements

                      | | Needs |
                      |---|---|
                      | Java | **25**, on the proxy and on every backend |
                      | Minecraft | 1.21 to 26.2 |
                      | Skript | 2.16.0+ |
                      | Proxy | BungeeCord or Velocity |

                      Java 25 is not optional, whatever Minecraft version you run: a 1.21
                      server also has to be started with Java 25.

                      Setup, guides and the full syntax reference are in the
                      [wiki](https://github.com/ahmadmsaleem/skNetwork/wiki).
