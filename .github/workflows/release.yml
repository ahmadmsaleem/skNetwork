name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build, for example v0.1.0'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build and publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0

            - name: Validate the Gradle wrapper
              uses: gradle/actions/wrapper-validation@v6

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: temurin
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Check the tag matches the project version
              run: |
                  TAG="${{ inputs.tag || github.ref_name }}"
                  PROJECT=$(grep -E '^version *= *' gradle.properties | sed 's/.*= *//')
                  echo "tag $TAG, gradle.properties $PROJECT"
                  if [ "$TAG" != "v$PROJECT" ]; then
                      echo "::error::Tag $TAG does not match version $PROJECT in gradle.properties."
                      exit 1
                  fi
                  if echo "$PROJECT" | grep -q SNAPSHOT; then
                      echo "::error::$PROJECT is a snapshot, so it cannot be released."
                      exit 1
                  fi

            - name: Run the tests
              run: ./gradlew :test:test --no-daemon --console=plain

            - name: Build the universal jar
              run: ./gradlew universalJar --no-daemon --console=plain

            # Downloads go through Modrinth, so the jar is kept here only long
            # enough for a maintainer to fetch it and upload it there.
            - name: Keep the jar for the Modrinth upload
              uses: actions/upload-artifact@v6
              with:
                  name: skNetwork-jar
                  path: build/libs/skNetwork-*.jar
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish the release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  name: skNetwork ${{ inputs.tag || github.ref_name }}
                  generate_release_notes: true
                  draft: true
                  prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
                  body: |
                      ## Download

                      **[Get it on Modrinth](https://modrinth.com/project/sknetwork)**

                      One jar goes on the proxy and on every backend. Java 25 is required
                      on both halves.

                      Setup and the full syntax reference are in the
                      [wiki](https://github.com/ahmadmsaleem/skNetwork/wiki).
