name: Tests

on:
    pull_request:
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: JUnit on Java ${{ matrix.java }}
        runs-on: ubuntu-latest
        if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
        strategy:
            fail-fast: false
            matrix:
                java: [25]
        steps:
            - uses: actions/checkout@v6

            - name: Validate the Gradle wrapper
              uses: gradle/actions/wrapper-validation@v6

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v5
              with:
                  java-version: ${{ matrix.java }}
                  distribution: temurin
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Run the tests
              run: ./gradlew :test:test --no-daemon --console=plain

            - name: Build the universal jar
              run: ./gradlew universalJar --no-daemon --console=plain

            - name: Upload the report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: test-report-java-${{ matrix.java }}
                  path: |
                      test/build/reports/tests/test
                      test/build/test-results/test
                  if-no-files-found: ignore
                  retention-days: 14
